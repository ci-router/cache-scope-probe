name: probe-workflow-run
on:
  workflow_run:
    workflows: [probe]
    types: [completed]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: ci-router/cache-scope-probe/probe@6cce4c72749f72b4d73ceb28d71f88e2fe3ee177
        with:
          label: workflow_run
          trigger: ${{ github.event.workflow_run.event }}
